name: Source checks (not Unreal validation)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m compileall -q Content/Python Tests
      - name: Test settings and plugin descriptor (no Unreal Engine)
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
